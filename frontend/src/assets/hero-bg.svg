<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <pattern id="fine" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 23.5H24" stroke="#fff" stroke-opacity=".07"/>
    </pattern>
    <pattern id="big" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M0 95.5H96M95.5 0V96" stroke="#fff" stroke-opacity=".13"/>
    </pattern>
    <pattern id="ruled" width="40" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 33.5H40" stroke="#2157F3" stroke-opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1600" height="720" fill="#0A2468"/>
  <rect width="1600" height="720" fill="url(#fine)"/>
  <rect width="1600" height="720" fill="url(#big)"/>

  <!-- page arrière -->
  <g transform="rotate(-7 1180 380)">
    <rect x="930" y="90" width="520" height="560" rx="14" fill="#2157F3"/>
  </g>

  <!-- page du carnet -->
  <g transform="rotate(4 1180 380)">
    <rect x="900" y="70" width="540" height="580" rx="14" fill="#FBFAFF"/>
    <rect x="900" y="70" width="540" height="580" rx="14" fill="url(#ruled)"/>
    <path d="M968 70V650" stroke="#E0364B" stroke-opacity=".55" stroke-width="2"/>
    <path d="M976 70V650" stroke="#E0364B" stroke-opacity=".55" stroke-width="2"/>
    <!-- signet -->
    <path d="M1320 70h56v110l-28-24-28 24z" fill="#FFD84D"/>
    <!-- titre -->
    <rect x="1000" y="120" width="230" height="26" rx="13" fill="#0A2468"/>
    <!-- surligneur -->
    <rect x="996" y="196" width="330" height="26" rx="6" fill="#FFD84D" fill-opacity=".85"/>
    <rect x="1000" y="200" width="300" height="10" rx="5" fill="#0A2468" fill-opacity=".75"/>
    <rect x="1000" y="262" width="360" height="10" rx="5" fill="#0A2468" fill-opacity=".35"/>
    <rect x="1000" y="296" width="320" height="10" rx="5" fill="#0A2468" fill-opacity=".35"/>
    <rect x="1000" y="330" width="260" height="10" rx="5" fill="#0A2468" fill-opacity=".35"/>
    <!-- note entourée au stylo rouge -->
    <ellipse cx="1290" cy="430" rx="74" ry="46" fill="none" stroke="#E0364B" stroke-width="5" stroke-linecap="round" transform="rotate(-6 1290 430)"/>
    <path d="M1252 432l22 22 44-52" fill="none" stroke="#E0364B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1000" y="410" width="150" height="10" rx="5" fill="#0A2468" fill-opacity=".35"/>
    <rect x="1000" y="444" width="120" height="10" rx="5" fill="#0A2468" fill-opacity=".35"/>
    <!-- signature -->
    <path d="M1010 580c30-50 46 30 70-14s34 28 62-10 30 20 66 2" fill="none" stroke="#2157F3" stroke-width="5" stroke-linecap="round"/>
    <path d="M1000 612H1250" stroke="#0A2468" stroke-opacity=".25" stroke-width="2"/>
  </g>

  <!-- crayon -->
  <g transform="rotate(-38 1060 640)">
    <rect x="780" y="620" width="300" height="38" rx="6" fill="#FFD84D"/>
    <rect x="780" y="620" width="300" height="12" rx="6" fill="#fff" fill-opacity=".25"/>
    <path d="M1080 620l58 19-58 19z" fill="#F3D9B1"/>
    <path d="M1120 632l18 7-18 7z" fill="#0A2468"/>
    <rect x="780" y="620" width="34" height="38" rx="6" fill="#E0364B"/>
  </g>
</svg>
